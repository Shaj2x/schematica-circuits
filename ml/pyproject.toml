[project]
name = "schematica-vision"
version = "0.1.0"
description = "Schematica's photo-to-schematic pipeline: detection, wire tracing, OCR and layout"
requires-python = ">=3.11,<3.13"
license = "MIT"
# Serving dependencies only. Inference runs the exported ONNX model with
# onnxruntime, so the backend never installs PyTorch or Ultralytics.
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "onnxruntime>=1.18",
]

[project.optional-dependencies]
# Reads component values ("10k", "4.7uF"). Ships its models inside the wheel,
# so nothing is downloaded at runtime.
ocr = ["rapidocr-onnxruntime>=1.4,<2"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]
# Training only (AGPL-3.0, see ml/README.md). Not needed to run the app.
train = ["ultralytics>=8.3,<9", "onnx>=1.16", "onnxslim>=0.1"]

[tool.uv]
# rapidocr depends on opencv-python, the GUI build of OpenCV. It installs the
# same `cv2` module as opencv-python-headless, so having both makes the import
# depend on install order. Drop it: the headless build provides everything OCR
# needs, without X11 libraries in the Docker image.
override-dependencies = ["opencv-python; sys_platform == 'never'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["schematica_vision"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
allowed-confusables = ["−", "µ", "Ω"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["cv2.*", "onnxruntime.*", "rapidocr_onnxruntime.*", "ultralytics.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
