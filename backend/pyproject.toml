[project]
name = "schematica-backend"
version = "0.1.0"
description = "Schematica API: saved circuits, solving, and step-by-step explanations"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "anthropic>=1,<2",
    "schematica-solver",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11"]

[tool.uv.sources]
# The Rust solver, built from source by maturin on `uv sync`.
schematica-solver = { path = "../solver-py" }

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# Equations shown to students use the typographic minus sign (U+2212) on purpose.
allowed-confusables = ["−"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["schematica_solver.*"]
ignore_missing_imports = false

[tool.pytest.ini_options]
testpaths = ["tests"]
