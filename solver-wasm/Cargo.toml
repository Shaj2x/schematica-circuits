[package]
name = "schematica-solver-wasm"
version = "0.1.0"
edition = "2024"
description = "WebAssembly bindings for schematica-solver"
license = "MIT"

[lib]
# cdylib produces the .wasm module; rlib lets `cargo test` run the
# wrapper's tests natively.
crate-type = ["cdylib", "rlib"]

[dependencies]
schematica-solver = { path = "../solver" }
serde_json = "1.0.151"
wasm-bindgen = "0.2.129"

